name: Build & push container
on:
  push:
    branches: [main]
    paths: ['docker/**', '.github/workflows/docker.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./docker
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lifebit-immunedeconv-nf:latest
            ghcr.io/${{ github.repository_owner }}/lifebit-immunedeconv-nf:${{ github.sha }}
